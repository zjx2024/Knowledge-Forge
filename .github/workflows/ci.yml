name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10.16'
          cache: pip
      - run: python -m pip install pip==25.3
      - run: python -m pip install -c constraints.txt -r requirements.txt
      - run: python -m pip check
      - run: python -m pytest --strict-markers -q -m "not integration and not live_model and not hugegraph_integration"
      - run: python -m py_compile knowledge_forge/*.py scripts/*.py server.py
      - run: git diff --check

  postgres-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg16-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-secret
          POSTGRES_DB: knowledge_forge_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d knowledge_forge_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      KNOWLEDGE_FORGE_TEST_POSTGRES_DSN: postgresql://postgres:ci-postgres-secret@127.0.0.1:5432/knowledge_forge_ci
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ci-postgres-secret
      POSTGRES_DB: knowledge_forge_ci
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10.16'
          cache: pip
      - run: python -m pip install pip==25.3
      - run: python -m pip install -c constraints.txt -r requirements.txt
      - run: python -m pip check
      - name: Collect integration tests
        run: |
          count=$(python -m pytest --strict-markers --collect-only -q -m integration | grep -c '::' || true)
          test "$count" -ge 10
      - name: Run PostgreSQL integration
        run: |
          set -o pipefail
          python -m pytest --strict-markers -q -m integration -rA | tee /tmp/integration.log
      - name: Require at least one passed integration test
        run: |
          grep -Eq '[1-9][0-9]* passed' /tmp/integration.log

  docker-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - run: docker compose -f docker-compose.yml config --quiet
        env:
          POSTGRES_PASSWORD: ci-postgres-secret
      - run: python scripts/verify_docker_artifacts.py --build --health
