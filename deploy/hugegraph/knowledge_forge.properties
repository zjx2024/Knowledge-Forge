gremlin.graph=org.apache.hugegraph.HugeFactory

vertex.cache_type=l2
edge.cache_type=l2

backend=rocksdb
serializer=binary
store=knowledge_forge

task.scheduler_type=local
task.schedule_period=10
task.retry=0
task.wait_timeout=10

search.text_analyzer=jieba
search.text_analyzer_mode=INDEX

# A physical graph must not share RocksDB paths with another graph.
rocksdb.data_path=rocksdb-data/knowledge_forge/data
rocksdb.wal_path=rocksdb-data/knowledge_forge/wal
